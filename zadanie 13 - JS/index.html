<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona</title>
</head>
<body>
    <h1 id="hello">Witaj na mojej stronie</h1>
    <button id="send">Wyślij</button>
    <hr>
    <form>
        <label for="price">Cena: </label>
        <input type="number" id="price" name="price" placeholder="Podaj cene"><br>

        <label for="amount">Ilosć: </label>
        <input type="number" id="amount" name="amount" placeholder="Podaj ilość"><br>

        <button id="calculate" onclick="obliczCene()" type="button">Oblicz</button><br>
    </form> 
    <p id="wyswietl"></p>
    <hr>
    <form>
        <label for="length">Dlugosc</label>
        <input type="number" id="length" name="length"><br>

        <label for="width">Szerokosc</label>
        <input type="number" id="width" name="length"><br>

        <label for="plytka">Podaj pole jednej plyki (m^2)</label>
        <input type="number" id="plytka" name="plytka">

        <button type="button" id="przycisk" onclick="obliczIlePlytek()">Oblicz</button>
    </form>
    <p id="tekst"></p>
    <script src="script.js"></script>
</body>
</html>
